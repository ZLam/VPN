name: TVmaze 剧集追踪 Widget
description: 使用 TVmaze 跟踪剧集的最近已播集、下一集和播出时间，支持中号、大号、分页与 24 小时缓存。
author: ZLam
homepage: https://github.com/ZLam/VPN
icon: play.tv.fill

env_schema:
  TRACKED_SHOWS:
    name: 跟踪剧集 JSON
    description: '格式：[{"name":"剧集名称","id":"TVmaze ID"}]；id 留空时会按 name 搜索。'
    default_value: '[]'
  PAGE:
    name: 显示页码
    description: 中号每页 3 部，大号每页 7 部；页码从 1 开始。
    default_value: '1'
  REFRESH_HOURS:
    name: 数据刷新间隔（小时）
    description: TVmaze 数据缓存时长，默认每天刷新一次。
    default_value: '24'
  REQUEST_TIMEOUT_SECONDS:
    name: 请求超时（秒）
    description: 单次 TVmaze 请求的最长等待时间。
    default_value: '10'

scriptings:
- generic:
    name: episode-tracker
    script_url: https://raw.githubusercontent.com/ZLam/VPN/refs/heads/main/egern/widget/episode_tracker/episode-tracker.js
    timeout: 30

widgets:
- name: 剧集追踪
  script_name: episode-tracker
  env:
    TRACKED_SHOWS: '[]'
    PAGE: '1'
    REFRESH_HOURS: '24'
    REQUEST_TIMEOUT_SECONDS: '10'
